name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  zed-editor:
    runs-on: ubuntu-latest
    # A full Zed release build (thin LTO) on a 4-core runner.
    timeout-minutes: 360
    steps:
      # The build needs well over the ~14 GB a fresh runner has free.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: zeditor
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        run: nix build --print-build-logs .#zed-editor
