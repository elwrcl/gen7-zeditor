name: update

# Weekly: move nixpkgs forward, and only keep the new lock if Zed still builds
# with the patches (and is then already in the cache). A failed run means the
# patches need rebasing onto the new Zed release.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true

      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: zeditor
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update nixpkgs
        run: nix flake update nixpkgs

      - name: Build
        run: nix build --print-build-logs .#zed-editor

      - name: Commit the new lock
        run: |
          git diff --quiet flake.lock && exit 0
          version=$(nix eval --raw .#zed-editor.version)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "flake.lock: update nixpkgs (zed-editor $version)" flake.lock
          git push
